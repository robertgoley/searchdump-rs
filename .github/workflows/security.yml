name: security
# Dependency advisories, licence/source policy, image CVE scan and SBOMs.
# Nothing is published: no registry login for pushing, no `push`, only
# workflow artifacts (SBOMs and scan reports).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, rewrite]
  workflow_dispatch:
    inputs:
      base:
        description: "Image bases: dhi-debian (default; dhi.io Debian 13 with a shell, glibc + mimalloc, amd64), dhi (dhi.io static glibc), dhi-alpine, alpine (public), debian (public)"
        type: choice
        options: [dhi-debian, dhi, dhi-alpine, alpine, debian]
        default: dhi-debian
      base_refresh:
        description: "1.3.1: resolve the current digests of the pinned dhi.io tags, build dhi-debian and dhi-alpine on them, and attach grype/trivy reports (nothing is committed or pushed)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches advisories published after the last push

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: 1.91.1 }
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with: { tool: "cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9" }
      # any vulnerability, or an unmaintained/unsound/yanked warning, fails the job
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories bans licenses sources
      # L-808f: THIRD-PARTY-NOTICES.md (generated block) must match Cargo.lock / the cargo-deny crate graph
      - run: scripts/third-party-notices.py --check
      - run: cargo cyclonedx --format json --override-filename sbom-cargo.cdx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom-cargo, path: "sbom-cargo.cdx.json" }

  image:
    # L-808h: Dependabot PRs get no repository secrets (the dhi.io pull login), so the
    # dhi.io login below would fail. Skip the whole job on PRs opened by Dependabot (the
    # PR author, so a human re-run of a Dependabot PR is skipped too). Every other event
    # (pushes to main/rewrite, schedule, dispatch, human PRs) still fails hard when the
    # secrets are missing. The dependencies, sbom-diff and secret-scan jobs still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      # F-01: pinned scanner releases, SHA-256 checked (no `curl | sh`).
      - name: Install scanners (pinned, checksum-verified)
        env:
          GRYPE_URL: https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
          SYFT_URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          TRIVY_URL: https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          fetch() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "/tmp/$1.tgz" "$2"
            echo "$3  /tmp/$1.tgz" | sha256sum -c -
            sudo tar -C /usr/local/bin -xzf "/tmp/$1.tgz" "$1"
          }
          fetch grype "$GRYPE_URL" "$GRYPE_SHA256"
          fetch syft "$SYFT_URL" "$SYFT_SHA256"
          fetch trivy "$TRIVY_URL" "$TRIVY_SHA256"
      # The default target is the dhi.io Debian image (`make image`, L-810c). Docker Hardened
      # Images need a pull login: add repository secrets DHI_USERNAME (Docker
      # ID) and DHI_TOKEN (a read-only/pull access token). No values live in
      # this repo; the login is pull-only and never reaches an image layer.
      # Without the secrets, run manually with base=alpine (public bases).
      - name: Log in to dhi.io (pull only)
        if: startsWith(inputs.base || 'dhi-debian', 'dhi')
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are not set; dhi.io pulls need them (or dispatch with base=alpine)"
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | podman login dhi.io -u "$DHI_USERNAME" --password-stdin
      # F-09: the dispatch input reaches the shell only through env and an
      # allow-list.
      - name: Build image (local only)
        env:
          BASE: ${{ inputs.base || 'dhi-debian' }}
        run: |
          case "$BASE" in
            dhi-debian) make image CONTAINER=podman ;;
            dhi) make image-dhi-static CONTAINER=podman ;;
            dhi-alpine) make image-dhi-alpine CONTAINER=podman ;;
            debian) make image-public CONTAINER=podman ;;
            alpine) make image-alpine CONTAINER=podman ;;
            *) echo "::error::unknown base '$BASE' (allowed: dhi-debian, dhi, dhi-alpine, alpine, debian)"; exit 1 ;;
          esac
      # L-211 / SUP-017: non-root, --read-only + /data, executable set, base digest, and (L-810c)
      # the elasticdump / elasticdump-rs / multielasticdump symlinks run as their targets.
      # IMAGE_VARIANT also picks the tag that sbom/scan read (Makefile SUFFIX_*).
      - name: Image hardening tests
        env:
          BASE: ${{ inputs.base || 'dhi-debian' }}
        run: |
          case "$BASE" in
            dhi) v=dhi-static ;; dhi-alpine) v=dhi-alpine ;; dhi-debian) v=dhi-debian ;; debian) v=public ;; alpine) v=alpine ;;
            *) echo "::error::unknown base '$BASE'"; exit 1 ;;
          esac
          echo "IMAGE_VARIANT=$v" >> "$GITHUB_ENV"
          make test-image CONTAINER=podman IMAGE_VARIANT="$v"
      - name: SBOM (CycloneDX + SPDX)
        run: make sbom CONTAINER=podman IMAGE_VARIANT="$IMAGE_VARIANT"
      - name: grype + trivy (fail on HIGH/CRITICAL)
        run: make scan CONTAINER=podman IMAGE_VARIANT="$IMAGE_VARIANT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom-image, path: "sbom-image.*.json" }
      - if: always()
        run: podman logout dhi.io || true

  # 1.3.1 (L-830): base digest refresh helper. dhi.io needs the pull login, which only CI has, so the
  # current digest of every pinned dhi.io tag is resolved here (manifest-list digest = sha256 of the
  # raw index) and printed to the job summary. dhi-debian and dhi-alpine are then built on the new
  # runtime-base digests (same builder pins) and scanned without failing the job; the reports are
  # artefacts. A person commits the digests (Makefile + Dockerfile) and the ignore-rule changes.
  base-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.base_refresh
    runs-on: ubuntu-24.04
    environment: dhi-pull
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - name: Install scanners (pinned, checksum-verified)
        env:
          GRYPE_URL: https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
          TRIVY_URL: https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          fetch() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "/tmp/$1.tgz" "$2"
            echo "$3  /tmp/$1.tgz" | sha256sum -c -
            sudo tar -C /usr/local/bin -xzf "/tmp/$1.tgz" "$1"
          }
          fetch grype "$GRYPE_URL" "$GRYPE_SHA256"
          fetch trivy "$TRIVY_URL" "$TRIVY_SHA256"
      - name: Log in to dhi.io (pull only)
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are not set; dhi.io pulls need them"
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | podman login dhi.io -u "$DHI_USERNAME" --password-stdin
      - name: Resolve current digests of the pinned dhi.io tags
        run: |
          set -euo pipefail
          mkdir -p base-refresh
          # every dhi.io IMAGE/TAG pair in the Makefile (TAG = tag@sha256:old)
          for v in BUILDER BASE DHI_STATIC_BASE DHI_ALPINE_BUILDER DHI_ALPINE_BASE; do
            img=$(sed -n "s/^${v}_IMAGE *?= *//p" Makefile)
            tag=$(sed -n "s/^${v}_TAG *?= *//p" Makefile)
            old=${tag#*@sha256:}; t=${tag%@*}
            new=$(skopeo inspect --raw "docker://$img:$t" | sha256sum | cut -d' ' -f1)
            [ "$old" = "$new" ] && same=unchanged || same=CHANGED
            echo "$v $img:$t old=$old new=$new $same" | tee -a base-refresh/digests.txt
            echo "${v}_NEW=$t@sha256:$new" >> "$GITHUB_ENV"
          done
          { echo '## dhi.io digests'; echo '```'; cat base-refresh/digests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # What the package repos offer on the new bases (installed vs candidate versions and the
      # openssh client dependency chain), to see which CVEs a package upgrade can fix.
      - name: Probe package candidates on the new bases
        run: |
          set -euo pipefail
          podman run --rm --user 0 --entrypoint /bin/sh "dhi.io/debian-base:$BASE_NEW" -c '
            export DEBIAN_FRONTEND=noninteractive; apt-get update -qq >/dev/null
            echo "# installed in the base"; dpkg-query -W libc6 libssl3t64 openssl libkrb5-3 libgssapi-krb5-2 libzstd1 2>&1 || true
            echo "# candidates"; apt-cache policy libc6 libssl3t64 openssl openssl-provider-legacy libkrb5-3 libgssapi-krb5-2 libk5crypto3 libkrb5support0 libzstd1 openssh-client
            echo "# openssh-client depends"; apt-cache depends --no-recommends --no-suggests openssh-client
            echo "# ssh-like clients"; apt-cache search --names-only "^(openssh-client|dropbear-bin|lsh-client)" || true
            echo "# upgradable"; apt list --upgradable 2>/dev/null
            echo "# DHI changelog of the newest libssl3t64 / libkrb5-3 / openssh-client"
            apt-get install -y -qq --no-install-recommends libssl3t64 openssh-client >/dev/null 2>&1 || true
            for p in libssl3t64 libkrb5-3 openssh-client; do echo "## $p"; zcat "/usr/share/doc/$p/changelog.Debian.gz" 2>/dev/null | head -40; done' > base-refresh/probe-dhi-debian.txt 2>&1 || true
          podman run --rm --user 0 --entrypoint /bin/sh "dhi.io/alpine-base:$DHI_ALPINE_BASE_NEW" -c '
            apk update -q >/dev/null
            echo "# installed"; apk list -I 2>/dev/null | grep -E "^(musl|libssl3|libcrypto3|zstd-libs|krb5)" || true
            echo "# candidates"; apk policy libssl3 libcrypto3 openssh-client-default openssh-client-common musl
            echo "# openssh-client-default depends"; apk info -R openssh-client-default' > base-refresh/probe-dhi-alpine.txt 2>&1 || true
          { echo '## probe dhi-debian'; echo '```'; cat base-refresh/probe-dhi-debian.txt; echo '```'
            echo '## probe dhi-alpine'; echo '```'; cat base-refresh/probe-dhi-alpine.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build, test and scan dhi-debian and dhi-alpine on the new base digests
        run: |
          set -euo pipefail
          make image CONTAINER=podman BASE_TAG="$BASE_NEW"
          make image-dhi-alpine CONTAINER=podman DHI_ALPINE_BASE_TAG="$DHI_ALPINE_BASE_NEW"
          for v in dhi-debian dhi-alpine; do
            make test-image CONTAINER=podman IMAGE_VARIANT="$v"
            make save CONTAINER=podman IMAGE_VARIANT="$v"
            podman run --rm --entrypoint /bin/sh "$(make -s print CONTAINER=podman IMAGE_VARIANT=$v | sed -n 's/.*VARIANT_IMAGE=\([^ ]*\).*/\1/p')" \
              -c 'if command -v dpkg-query >/dev/null; then dpkg-query -W libc6 libssl3t64 openssl libkrb5-3 libgssapi-krb5-2 libzstd1 openssh-client; else apk info -v 2>/dev/null | grep -E "^(musl|libssl3|libcrypto3|openssh|zstd)"; fi' \
              > "base-refresh/packages-$v.txt" || true
            grype docker-archive:image.tar -o json --file "base-refresh/grype-$v-noignore.json"
            ign=$(ls docker/grype-ignore."$v".yaml 2>/dev/null || echo docker/grype-ignore.yaml)
            grype -c "$ign" docker-archive:image.tar -o table --file "base-refresh/grype-$v-ignored.txt"
            tign=$(ls docker/trivyignore."$v".yaml 2>/dev/null || true)
            trivy image --input image.tar --severity HIGH,CRITICAL --format json --output "base-refresh/trivy-$v-noignore.json"
            trivy image --input image.tar --severity HIGH,CRITICAL ${tign:+--ignorefile "$tign"} --output "base-refresh/trivy-$v-ignored.txt"
            { echo "## $v"; echo '```'; cat "base-refresh/packages-$v.txt"; echo; grep -E 'High|Critical' "base-refresh/grype-$v-ignored.txt" || echo "grype: no High/Critical after ignore rules"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: base-refresh, path: base-refresh/ }
      - if: always()
        run: podman logout dhi.io || true

  # L-204 / SUP-007: cargo-udeps (nightly, compiles every target incl. the it/load test features).
  unused-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, nightly
        with: { toolchain: nightly }
      - run: cargo +nightly install --locked --version 0.1.61 cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --features searchdump-rs/load

  # L-212 / SUP-019: weekly crate publisher/ownership diff against supply-chain/publishers.json.
  # Exit 10 (job fails) when an existing crate gains or loses an owner; the report is an artefact.
  publishers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: 1.91.1 }
      - run: cargo install --locked --version 0.3.8 cargo-supply-chain
      # no `update`: without the db-dump cache it queries the crates.io API (~2 s/crate, ~8 min)
      - run: cargo supply-chain json > sc.json
      - run: scripts/sup/publishers.py diff supply-chain/publishers.json sc.json --markdown | tee publishers-report.md >> "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publishers-report
          path: |
            publishers-report.md
            sc.json

  # L-205 / SUP-008: coverage (T0+T1 here; T2 via scripts/sup/coverage.sh locally) and the
  # never-executed function list reviewed into docs/UNCOVERED-FUNCTIONS.md each release.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, nightly (installs the tools)
        with: { toolchain: nightly }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: 1.91.1, components: llvm-tools-preview }
      - run: cargo +nightly install --locked --version 0.9.1 cargo-llvm-cov
      - run: cargo +nightly install --locked --version 0.9.150 cargo-nextest
      - run: cargo +nightly install --locked --version 0.2.1 rustfilt
      - run: cargo llvm-cov --no-report nextest -p searchdump-rs --features load --profile unit
      - run: cargo llvm-cov --no-report nextest -p searchdump-rs --features load --profile contract
      - run: cargo llvm-cov report -p searchdump-rs --json --output-path cov.json
      - run: scripts/sup/uncovered.py cov.json --root "$PWD" >> "$GITHUB_STEP_SUMMARY"

  # L-206 / SUP-009: build-time code inventory gate + release build with --network none.
  offline-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: 1.91.1 }
      - run: scripts/sup/build-inventory.py
      - run: scripts/sup/offline-build.sh

  # L-207 / SUP-011: SBOM + build-time inventory diff against the PR base; a non-empty diff
  # needs the `sbom-reviewed` label. The diff is attached as an artefact and job summary.
  sbom-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: 1.91.1 }
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with: { tool: "cargo-cyclonedx@0.5.9" }
      - name: SBOM diff and label gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'sbom-reviewed') }}
        run: |
          rc=0; scripts/sup/sbom-pr.sh "$BASE_SHA" sbom-diff || rc=$?
          cat sbom-diff/diff.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 10 ] && [ "$REVIEWED" != true ]; then
            echo "::error::SBOM/build-time code changed: review, then add the sbom-reviewed label"; exit 1
          fi
          [ "$rc" = 0 ] || [ "$rc" = 10 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: sbom-diff, path: sbom-diff/ }

  # L-210 / SUP-015: gitleaks (history, or the PR's commits) + tracked tree + secrets canary suite.
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: 1.91.1 }
      - name: install gitleaks 8.28.0 (checksum-verified)
        run: |
          V=8.28.0; cd "$RUNNER_TEMP"
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o gl.sums "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep linux_x64.tar.gz gl.sums | sed 's#  .*#  gl.tgz#' | sha256sum -c
          tar -xzf gl.tgz gitleaks && install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: scan
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: scripts/sup/secret-scan.sh ${RANGE:+"$RANGE"}

  # Workflow static analysis (Grok Bot, 2026-11-02; same command as scripts/lint-workflows.sh).
  # Pinned zizmor release binary, SHA-256 checked (F-01 style); --offline = no GitHub API token.
  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - name: install zizmor 1.31.1 (checksum-verified)
        env:
          ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o zizmor.tgz "$ZIZMOR_URL"
          echo "$ZIZMOR_SHA256  zizmor.tgz" | sha256sum -c -
          tar -xzf zizmor.tgz zizmor
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: zizmor --offline --min-severity low .github/workflows/
