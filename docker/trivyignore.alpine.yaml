    purls:
      - pkg:apk/alpine/libssl3@3.5.9-r1
      - pkg:apk/alpine/libcrypto3@3.5.9-r1
      - pkg:apk/alpine/libssl3@3.5.9-r3
      - pkg:apk/alpine/libcrypto3@3.5.9-r3
    statement: "no fixed Alpine openssl yet (upstream 3.5.10); accepted for the alpine image by Robert 2026-11-27 (t273u) until a fixed build ships, see SECURITY-CVE.md (L-831)"
