# L4-031 (1.4.0, owner decision 2026-11-27, Robert t273u): trivy ignore rules for the public `alpine` image only
# (`make scan` passes this file with --ignorefile when IMAGE_VARIANT=alpine). Same ids as
# docker/grype-ignore.alpine.yaml and docker/trivyignore.dhi-alpine.yaml, scoped to libssl3/libcrypto3 at 3.5.9-r1
# and 3.5.9-r3 (versioned purls). trivy rated none of them HIGH on 2026-11-27; the entries keep the two scanners
# consistent if its rating changes. See SECURITY-CVE.md "OpenSSL 3.5.9 (L-831)".
vulnerabilities:
