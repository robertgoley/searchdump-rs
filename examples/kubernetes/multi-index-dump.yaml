# Dump every index matching MATCH with searchdump-multi.
#
# 1.2: pages and how many indices run at once come from the cluster (--serverLimits,
# SERVER_LIMITS default auto; min for a fragile or shared cluster; off = 1.1.0 sizes). Manual
# override (warns above the cluster's limits): LIMIT / MAX_RESPONSE_MB / PARALLEL (the 1.1
# small-heap recipe: 500 / 64 / 1). Set RESUME=1 to add --resume and finish a previous run.
#
# searchdump-multi has no --ca. For a private CA, mount the bundle (for
# example from Secret searchdump-tls, key ca.pem) at /run/searchdump/ca.pem
# and set SSL_CERT_FILE=/run/searchdump/ca.pem, or install the CA in the
# node / image trust store.
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-multi-index-dump
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.3.1-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              extra=""
              if [ -n "${RESUME:-}" ]; then
                extra="${extra} --resume"
              fi
              if [ -n "${PARALLEL:-}" ]; then
                extra="${extra} --parallel=${PARALLEL}"
              fi
              child="--scrollTime=${SCROLL_TIME}"
              [ -n "${LIMIT:-}" ] && child="${child} --limit=${LIMIT}"
              [ -n "${MAX_RESPONSE_MB:-}" ] && child="${child} --maxResponseMb=${MAX_RESPONSE_MB}"
              # shellcheck disable=SC2086
              searchdump-multi --direction=dump --input="${ES_URL}" --output=/data \
                --match="${MATCH}" --compression="${COMPRESSION}" --serverLimits="${SERVER_LIMITS}" \
                ${extra} -- ${child}
          env:
            - name: ES_URL
              value: http://elasticsearch.default.svc:9200
            - name: MATCH
              value: "^logs-"
            - name: SERVER_LIMITS
              value: auto
            - name: PARALLEL
              value: ""
            - name: LIMIT
              value: ""
            - name: COMPRESSION
              value: zstd1
            - name: SCROLL_TIME
              value: 10m
            - name: MAX_RESPONSE_MB
              value: ""
            - name: RESUME
              value: ""
            - name: SEARCHDUMP_INPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_INPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
