# Load a searchdump-multi dump directory from the searchdump-dumps PVC,
# including split parts, in order. Set SKIP_EXISTING=1 to pass --skipExisting
# when some target indices already exist. PREFIX / SUFFIX rename loaded indices.
# 1.2: bulk sizes come from the target (--serverLimits, SERVER_LIMITS default auto). Manual
# override (warns above the target's limits): set LIMIT / CONCURRENCY / MAX_BULK_BYTES / PARALLEL
# (the 1.1 small-heap recipe: 500 / 1 / 16mb / 1). SERVER_LIMITS=off restores the 1.1.0 sizes.
# MAX_BULK_BYTES (16mb) caps each bulk: the default 100 MB bulk of 5000 large
# documents was refused with HTTP 429 (indexing_pressure) even by a 1 GB heap.
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-multi-index-restore
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.4.0-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              extra=""
              if [ -n "${SKIP_EXISTING:-}" ]; then
                extra="${extra} --skipExisting"
              fi
              if [ -n "${PREFIX:-}" ]; then
                extra="${extra} --prefix=${PREFIX}"
              fi
              if [ -n "${SUFFIX:-}" ]; then
                extra="${extra} --suffix=${SUFFIX}"
              fi
              if [ -n "${PARALLEL:-}" ]; then
                extra="${extra} --parallel=${PARALLEL}"
              fi
              child=""
              [ -n "${LIMIT:-}" ] && child="${child} --limit=${LIMIT}"
              [ -n "${CONCURRENCY:-}" ] && child="${child} --concurrency=${CONCURRENCY}"
              [ -n "${MAX_BULK_BYTES:-}" ] && child="${child} --maxBulkBytes=${MAX_BULK_BYTES}"
              if [ -n "${child}" ]; then
                child="-- ${child}"
              fi
              # shellcheck disable=SC2086
              searchdump-multi --direction=load --input=/data --output="${DEST_ES_URL}" \
                --serverLimits="${SERVER_LIMITS}" ${extra} ${child}
          env:
            - name: DEST_ES_URL
              value: http://elasticsearch.default.svc:9200
            - name: SERVER_LIMITS
              value: auto
            - name: PARALLEL
              value: ""
            - name: LIMIT
              value: ""
            - name: CONCURRENCY
              value: ""
            - name: MAX_BULK_BYTES
              value: ""
            - name: SKIP_EXISTING
              value: ""
            - name: PREFIX
              value: ""
            - name: SUFFIX
              value: ""
            - name: SEARCHDUMP_OUTPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_OUTPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
