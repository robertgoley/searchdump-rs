# Dump a large index in --fileSize parts (default 1gb) with a longer scroll
# keep-alive. searchdump has no --resume; if the Job fails mid-index, check
# /data and usually start the index again (--overwrite replaces existing
# parts). For many indices, use multi-index-dump.yaml with --resume.
#
# Since 1.1.0 (the 1.1.0 image or one built with `make image`, not a 1.0.0
# image): exit status 4 means a transient failure that is safe to rerun,
# so podFailurePolicy below retries only that (up to backoffLimit) and fails
# the Job at once on any other non-zero status; RESTART_ON_CONTEXT_LOSS=N adds
# --restartOnContextLoss=N (a lost scroll context restarts the dump from the
# start inside the same pod). With the 1.0.0 image leave it empty; transient
# failures then exit 1 and are not retried.
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-very-large-index-dump
spec:
  backoffLimit: 2
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: searchdump
          operator: NotIn
          values: [4]
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.4.0-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              searchdump --input="${ES_URL}/${INDEX}" --output="/data/${INDEX}.settings.json" --type=settings --overwrite
              searchdump --input="${ES_URL}/${INDEX}" --output="/data/${INDEX}.mapping.json" --type=mapping --overwrite
              searchdump --input="${ES_URL}/${INDEX}" --output="/data/${INDEX}.data.json" --type=data --overwrite \
                --compressionType=zstd --compressionLevel=1 --fileSize="${FILE_SIZE}" --scrollTime="${SCROLL_TIME}" \
                --limit="${LIMIT}" --workers="${WORKERS}" --maxResponseMb=256 \
                ${RESTART_ON_CONTEXT_LOSS:+--restartOnContextLoss="${RESTART_ON_CONTEXT_LOSS}"}
          env:
            - name: FILE_SIZE
              value: 1gb
            - name: SCROLL_TIME
              value: 30m
            - name: LIMIT
              value: "1000"
            - name: WORKERS
              value: "4"
            - name: RESTART_ON_CONTEXT_LOSS
              value: ""
            - name: ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: DEST_ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: INDEX
              value: logs
            - name: DEST_INDEX
              value: logs
            - name: SEARCHDUMP_INPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_INPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
