[package]
name = "edverify"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Test-only document-set verifier for searchdump (TST-INF-005)"
license = "MIT"
publish = false

# Independent of the code under test: no dependency on searchdump.
[dependencies]
anyhow = "1.0.102"
clap = { version = "4.4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# L4-004: the same reqwest 0.13 as searchdump (one version in the lock file), with the ring
# provider installed explicitly (no aws-lc build script).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11"
sonic-rs = "0.5.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.14", default-features = false }
